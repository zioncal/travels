<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הטיולים שלי</title>
<meta name="description" content="יומן הטיולים שלי בארץ ובעולם – מפה, סיפורים, תמונות וסרטונים">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <h1 class="site-title"><a href="./">הטיולים שלי</a></h1>

<div class="map-wrap">

  <div class="filters" role="group" aria-label="סינון טיולים">

    <button type="button" data-f="world" aria-pressed="false">בעולם</button>
  </div>
</div>

<main id="list"></main>

<footer>כל התמונות והסרטונים באתר צולמו על ידי. אין להעתיק ללא רשות.</footer>
